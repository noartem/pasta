<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Pasta{% endblock %}</title>

    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="{{ assets.url("resources/css/app.css") }}">
    {% block head %}{% endblock %}
</head>

<body class="font-sans antialiased dark:bg-[#282c34]">
    <div class="relative flex flex-col max-h-screen min-h-screen overflow-auto">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
